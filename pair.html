<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SITRA PAIR</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
.card{background:#161616;border:1px solid #333;padding:30px;border-radius:20px;width:90%;max-width:380px;text-align:center;box-shadow:0 0 30px rgba(0,255,136,0.1)}
h1{color:#00ff88;margin:0 0 10px}
input{width:100%;padding:15px;border-radius:10px;border:1px solid #333;background:#000;color:#fff;font-size:16px;margin:20px 0;box-sizing:border-box}
button{width:100%;padding:15px;background:#00ff88;color:#000;border:none;border-radius:10px;font-weight:bold;font-size:16px;cursor:pointer}
.code-box{margin-top:20px;background:#000;padding:20px;border-radius:10px;border:1px dashed #00ff88;display:none}
.code{font-size:28px;letter-spacing:5px;color:#00ff88;font-weight:bold}
small{color:#888}
</style>
</head>
<body>
<div class="card">
<h1>SITRA BOT</h1>
<small>موقع الاقتران الرسمي</small>
<input id="num" placeholder="اكتب رقم الواتساب مع رمز البلد مثلا 2499xxxx">
<button onclick="getCode()">احصل على الكود</button>
<div id="result" class="code-box">
<div>كود الاقتران الخاص بك:</div>
<div id="code" class="code"></div>
<small>اذهب لواتساب > الاجهزة المرتبطة > ربط بجهاز > ربط برقم الهاتف</small>
</div>
<div id="loading" style="display:none;margin-top:20px">جاري توليد الكود...</div>
</div>
<script>
async function getCode(){
 let n=document.getElementById('num').value;
 if(!n) return alert('اكتب الرقم');
 document.getElementById('loading').style.display='block';
 document.getElementById('result').style.display='none';
 let res=await fetch('/code?number='+n);
 let data=await res.json();
 document.getElementById('loading').style.display='none';
 if(data.code){
  document.getElementById('code').innerText=data.code;
  document.getElementById('result').style.display='block';
 }else{
  alert(data.error||'حدث خطأ');
 }
}
</script>
</body>
</html>
